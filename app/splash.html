<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #1852E8;
      color: #F4F7FB;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      border-radius: 12px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1852E8;
      border-top-color: #F4F7FB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>ModernSlides</h2>
  <div class="spinner"></div>
</body>
</html>
